spring.application.name=Ece
mybatis.mapper-locations=classpath:mappers/*xml
mybatis.type-aliases-package=com.example.Ece.mybatis.entity
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.name=defaultDataSource
# rewriteBatchedStatements=true：让 Connector/J 把 batchUpdate 改写成多值 INSERT。
# 不加这个参数时 batchUpdate 仍会逐条发送，批量写入毫无收益——实测 338 块知识块的入库耗时
# 从 4,000 ms 级降到数百毫秒级（见 spec §32）。
spring.datasource.url=jdbc:mysql://localhost:3306/cropdisease?serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
spring.datasource.username=${CROPDISEASE_DB_USER:cropdisease_app}
spring.datasource.password=${CROPDISEASE_DB_PASSWORD}
server.port=9999
file.ip=localhost
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
file.upload-dir=files
agent.knowledge.library-root=${AGRI_KNOWLEDGE_LIBRARY_ROOT:../\u519C\u4E1A\u8BBA\u6587}

# DeepSeek 配置仅从运行环境读取；不得在此文件中填写真实 API Key。
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}

# 向量服务（Flask 侧 bge-small-zh）；不可用时检索自动降级为 BM25
embedding.base-url=${EMBEDDING_BASE_URL:http://127.0.0.1:5000}
embedding.timeout-ms=${EMBEDDING_TIMEOUT_MS:3000}

# 当地农情环境数据源。两种来源由返回值的 source 字段区分
# （OBSERVED = 实时取到 / SIMULATED_LOCATION = 演示用模拟地），面板与报告都必须显示，不得混同。
# 演示不依赖网络与配额：demo-mode=true、未配置实时源、或取数失败，都退回模拟地并说明原因。
agent.agri.environment.enabled=true
agent.agri.environment.demo-mode=${AGRI_DEMO_MODE:false}
agent.agri.environment.api-url=${AGRI_WEATHER_API_URL:http://www.tianqiapi.com/api}
agent.agri.environment.app-id=${AGRI_WEATHER_APPID:}
agent.agri.environment.app-secret=${AGRI_WEATHER_APPSECRET:}
agent.agri.environment.city-id=${AGRI_WEATHER_CITYID:}
agent.agri.environment.timeout-ms=${AGRI_WEATHER_TIMEOUT_MS:3000}
# 模拟地的中文默认值**刻意不写在这个文件里**：Spring Boot 对 .properties 默认按 ISO-8859-1 读取，
# 中文值会乱码（实测接口返回 "æéï¼æ¼ç¨æ¨¡æå°ï¼"）。
# 中文默认值放在 AgriEnvironmentProperties 的 Java 字段上（编译期 UTF-8，正确）。
# 若要在此覆盖，请改用 \uXXXX 转义，不要直接写中文。
agent.agri.environment.simulated-temperature-c=24.0
agent.agri.environment.simulated-humidity-pct=78.0
